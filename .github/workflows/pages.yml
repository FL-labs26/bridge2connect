name: Website review on GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: npm run check
      - name: Test routes, forms and deploy paths
        run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build review site (noindex)
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: https://fl-labs26.github.io
      - name: Upload only the built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy review
        id: deploy
        uses: actions/deploy-pages@v4
